name: Build firmware

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 0

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3

      - name: List build artifacts
        run: |
          echo "=== build dir ==="
          ls -la build/
          echo "=== bins ==="
          find build -name '*.bin' -o -name '*.elf' | head -50

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=passport-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload artifact (branch push)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            build/**/*.bin
            build/*.bin

      - name: Create release (tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: |
            build/**/*.bin
            build/*.bin
